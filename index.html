<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>학동성결교회</title>
  <!-- CSS 연결 -->
  <link rel="stylesheet" href="./css/style.css">

    <!-- 갤러리 섹션 -->

  <!-- JS 연결 (반드시 body 맨 아래에 위치) -->
  <script src="./js/nav.js"></script>
